apiVersion: apps/v1
kind: Deployment
metadata:
  name: cars-advertisement-controller
  namespace: cars-operator-system
  labels:
    app.kubernetes.io/name: cars-advertisement-controller
    app.kubernetes.io/part-of: cars
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cars-advertisement-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cars-advertisement-controller
        app.kubernetes.io/part-of: cars
    spec:
      serviceAccountName: cars-operator-node
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [server2, server3]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: cars-advertisement-controller
      containers:
        - name: controller
          image: registry.cars-operator-system.svc.cluster.local:5000/cars-node:latest
          imagePullPolicy: IfNotPresent
          command: ["node", "dist/src/advertisement-controller.js"]
          envFrom:
            - secretRef:
                name: cars-environment
            - secretRef:
                name: cars-advertisement-controller
          env:
            - name: ADVERTISEMENT_NETWORK
              value: mainnet
            - name: ADVERTISEMENT_CONTROLLER_PORT
              value: "8081"
            - name: ADVERTISEMENT_RECONCILE_INTERVAL_MS
              value: "300000"
            - name: ADVERTISEMENT_GASP_INTERVAL_MS
              value: "21600000"
            - name: ADVERTISEMENT_RECONCILE_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: cars-advertisement-controller
  namespace: cars-operator-system
  labels:
    app.kubernetes.io/name: cars-advertisement-controller
spec:
  selector:
    app.kubernetes.io/name: cars-advertisement-controller
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cars-advertisement-controller
  namespace: cars-operator-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cars-advertisement-controller
