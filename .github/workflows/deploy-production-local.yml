name: Deploy Production Local

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged master SHA to deploy
        required: true
        type: string

concurrency:
  group: cars-node-prod-local
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on:
      - self-hosted
      - evans-creek-local-deploy
      - linux-amd64
      - docker
      - kubectl
      - local-registry
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify approved master source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/master

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and push image
        id: build
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: scripts/k8s/build-local-image.sh

      - name: Deploy to local Kubernetes
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          IMAGE_TAG: ${{ steps.build.outputs.image_tag }}
        run: scripts/k8s/deploy-local.sh
