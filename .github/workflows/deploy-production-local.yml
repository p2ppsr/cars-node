name: Build Production Image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact merged master SHA to deploy
        required: true
        type: string

concurrency:
  group: cars-node-production-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on:
      - self-hosted
      - evans-creek-local-deploy
      - linux-amd64
      - docker
      - local-registry
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify approved master source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "${SOURCE_SHA}" origin/master

      - name: Build and push image
        id: build
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: scripts/k8s/build-local-image.sh

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_INSECURE: "true"
        with:
          image-ref: ${{ steps.build.outputs.image }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate production dependency SBOM
        run: npm sbom --omit=dev --sbom-format=cyclonedx > release-sbom.cdx.json

      - name: Record immutable release
        run: |
          test "$(jq -r .source_sha release-manifest.json)" = "${{ inputs.source_sha }}"
          test "$(jq -r .image release-manifest.json)" = "${{ steps.build.outputs.image }}"
          {
            echo '## CARS production image'
            echo ''
            echo '- Source: `${{ inputs.source_sha }}`'
            echo '- Image: `${{ steps.build.outputs.image }}`'
            echo ''
            echo 'Deployment is intentionally owned by the network-ops control plane; this build runner has no Kubernetes credential.'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cars-production-release-${{ inputs.source_sha }}
          path: |
            release-manifest.json
            release-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
