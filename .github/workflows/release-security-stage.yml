name: Validate Release Security Stage

on:
  pull_request:
    branches: [master]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - .github/workflows/deploy-production-local.yml
      - .github/workflows/release-security-stage.yml

permissions:
  contents: read

jobs:
  validate:
    name: Release security evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run dependency audit and validate streamed SBOM
        env:
          BUILDKIT_PROGRESS: plain
        run: |
          docker build --platform linux/amd64 \
            --target release-security-evidence \
            --build-arg "SECURITY_AUDIT_NONCE=pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --output type=tar,dest=- . | tar --extract --file=-
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' release-sbom.cdx.json >/dev/null
